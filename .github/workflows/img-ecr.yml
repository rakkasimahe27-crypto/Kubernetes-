name: Build and Push Multi-Images to ECR

on:
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: arn:aws:iam::960631463530:role/mahe-oidc
  TARGET_ENV: ${{ vars.ENVIRONMENT }}
  REPOSITORY_ID: ${{ github.repository }}
  FOLDER_NAME: Day-9-Ingress-Path-Base-Deployment

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Repository Details
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Folder: ${{ env.FOLDER_NAME }}"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICES=("main" "aws" "gcp" "azure")

          for SERVICE in "${SERVICES[@]}"; do

            echo "Processing: $SERVICE"

            cd "${GITHUB_WORKSPACE}/${FOLDER_NAME}/${SERVICE}"

            docker build \
              -t "${ECR_REGISTRY}/${SERVICE}:latest" \
              -t "${ECR_REGISTRY}/${SERVICE}:${IMAGE_TAG}" .

            docker push -a "${ECR_REGISTRY}/${SERVICE}"

            cd "${GITHUB_WORKSPACE}"

          done
