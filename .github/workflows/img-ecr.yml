name: Build and Push Multi-Images to ECR

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::960631463530:role/mahe-oidc
  TARGET_ENV: ${{ vars.ENVIRONMENT }}
  REPOSITORY_ID: ${{ github.repository_id }}
  REPOSITORY_NAME: ${{ github.repository }}
  FOLDER_NAME: Day-9-Ingress-Path-Base-Deployment

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Repository Details
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Repository Owner: ${{ github.repository_owner }}"
          echo "Folder: ${{ env.FOLDER_NAME }}"
          echo "Environment: ${{ env.TARGET_ENV }}"
          - name: List Workspace Contents
            run: ls -R ${GITHUB_WORKSPACE}

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
       - name: Build, Tag, and Push Images
         env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
         run: |
          BASE_DIR="${GITHUB_WORKSPACE}/${FOLDER_NAME}"
          SERVICES=("aws" "gcp" "azure") # Add "main" back only if a main/ folder exists

          for SERVICE in "${SERVICES[@]}"; do
            TARGET_DIR="${BASE_DIR}/${SERVICE}"
            echo "=================================="
            echo "Processing: $SERVICE ($TARGET_DIR)"
            echo "=================================="

            if [ ! -d "$TARGET_DIR" ]; then
              echo "Error: Directory $TARGET_DIR not found!"
              exit 1
            fi

            cd "$TARGET_DIR"
            docker build \
              -t "${ECR_REGISTRY}/${SERVICE}:latest" \
              -t "${ECR_REGISTRY}/${SERVICE}:${IMAGE_TAG}" .

            docker push -a "${ECR_REGISTRY}/${SERVICE}"
            cd "${GITHUB_WORKSPACE}"
          done
